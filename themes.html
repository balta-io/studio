    <script>
        document.querySelectorAll('.theme-token-row').forEach(row => {
            const textInput = row.querySelector('.theme-token-input');
            const colorPicker = row.querySelector('.theme-token-picker');
            textInput.addEventListener('input', () => {
                if (/^#[0-9a-f]{6}$/i.test(textInput.value.trim())) {
                    colorPicker.value = textInput.value.trim();
                }
            });
            colorPicker.addEventListener('input', () => {
                textInput.value = colorPicker.value.toUpperCase();
            });
        });
    </script>
