<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
    <title>Studio | Publicar</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="app-shell publish-shell">
        <header class="app-header">
            <a class="back-button" href="index.html" data-history-back aria-label="Voltar" title="Voltar">
                <i class="ri-arrow-left-line" aria-hidden="true"></i>
                <span>BACK</span>
            </a>

            <div class="header-actions">
                <button class="header-button" id="theme-toggle" type="button" aria-label="Ativar tema escuro"
                    title="Ativar tema escuro" aria-pressed="false">
                    <i class="ri-moon-line header-button-icon" aria-hidden="true"></i>
                    <span class="header-button-label">Theme</span>
                </button>
            </div>
        </header>

        <main class="app-main publish-main">
            <section class="publish-view" aria-labelledby="publish-title">
                <div class="publish-view-header">
                    <p class="eyebrow" data-publish-type></p>
                    <h1 id="publish-title" data-publish-title></h1>
                    <p class="publish-file-path" data-publish-path></p>
                </div>

                <div class="publish-columns">
                    <section class="publish-column" aria-labelledby="publish-images-title">
                        <div class="publish-column-header">
                            <i class="ri-image-line" aria-hidden="true"></i>
                            <h2 id="publish-images-title">Imagens</h2>
                            <span data-publish-count="images" aria-live="polite"></span>
                        </div>
                        <div class="publish-file-list" data-publish-list="images" aria-live="polite"></div>
                        <div class="publish-column-actions">
                            <a class="save-article-button publish-new-image-button" data-new-image-link
                                href="images.html">
                                <i class="ri-add-line" aria-hidden="true"></i>
                                <span>NEW</span>
                            </a>
                            <button class="save-article-button publish-upload-image-button" data-upload-image-button
                                type="button">
                                <i class="ri-upload-2-line" aria-hidden="true"></i>
                                <span>UPLOAD</span>
                            </button>
                            <input type="file" data-upload-image-input accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.svg"
                                multiple hidden>
                        </div>
                    </section>

                    <section class="publish-column" aria-labelledby="publish-posts-title">
                        <div class="publish-column-header">
                            <i class="ri-article-line" aria-hidden="true"></i>
                            <h2 id="publish-posts-title">Posts</h2>
                            <span data-publish-count="posts" aria-live="polite"></span>
                        </div>
                        <div class="publish-file-list" data-publish-list="posts" aria-live="polite"></div>
                        <button class="save-article-button publish-new-image-button" data-new-post-button type="button">
                            <i class="ri-add-line" aria-hidden="true"></i>
                            <span>NEW</span>
                        </button>
                    </section>

                    <section class="publish-column" aria-labelledby="publish-campaigns-title">
                        <div class="publish-column-header">
                            <i class="ri-megaphone-line" aria-hidden="true"></i>
                            <h2 id="publish-campaigns-title">Campanhas</h2>
                            <span data-publish-count="campaigns" aria-live="polite"></span>
                        </div>
                        <div class="publish-file-list" data-publish-list="campaigns" aria-live="polite"></div>
                        <button class="save-article-button publish-new-image-button" data-new-campaign-button
                            type="button">
                            <i class="ri-add-line" aria-hidden="true"></i>
                            <span>NEW</span>
                        </button>
                    </section>
                </div>
            </section>
        </main>

        <div class="folder-status" data-publish-status role="status" aria-live="polite" aria-hidden="true">
            <i class="ri-information-line folder-status-icon" aria-hidden="true"></i>
            <span class="folder-status-message"></span>
        </div>
    </div>

    <dialog class="asset-dialog" data-post-dialog aria-labelledby="post-dialog-title">
        <form class="asset-dialog-form" data-post-form>
            <div class="asset-dialog-header">
                <h2 id="post-dialog-title" data-post-dialog-title>Novo post</h2>
                <button class="asset-dialog-close" data-post-dialog-close type="button" aria-label="Fechar"
                    title="Fechar">
                    <i class="ri-close-line" aria-hidden="true"></i>
                </button>
            </div>
            <select class="asset-dialog-select" data-post-network aria-label="Rede social">
                <option value="Discord">Discord</option>
                <option value="Instagram">Instagram</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="YouTube">YouTube</option>
            </select>
            <input class="asset-dialog-title" data-post-published-at type="datetime-local"
                aria-label="Published at (UTC)">
            <textarea class="asset-dialog-editor" data-post-message aria-label="Mensagem do post"></textarea>
            <div class="asset-dialog-actions">
                <button class="asset-dialog-button asset-dialog-delete" data-post-delete type="button" hidden>
                    <i class="ri-delete-bin-line" aria-hidden="true"></i>
                    <span>DELETE</span>
                </button>
                <button class="asset-dialog-button asset-dialog-save" data-post-save type="button">
                    <i class="ri-save-line" aria-hidden="true"></i>
                    <span>Salvar</span>
                </button>
            </div>
        </form>
    </dialog>

    <dialog class="asset-dialog" data-campaign-dialog aria-labelledby="campaign-dialog-title">
        <form class="asset-dialog-form" data-campaign-form>
            <div class="asset-dialog-header">
                <h2 id="campaign-dialog-title" data-campaign-dialog-title>Nova campanha</h2>
                <button class="asset-dialog-close" data-campaign-dialog-close type="button" aria-label="Fechar"
                    title="Fechar">
                    <i class="ri-close-line" aria-hidden="true"></i>
                </button>
            </div>
            <input class="asset-dialog-title" data-campaign-title type="text" maxlength="80" placeholder="Title"
                aria-label="Title">
            <input class="asset-dialog-title" data-campaign-subtitle type="text" maxlength="80" placeholder="Subtitle"
                aria-label="Subtitle">
            <input class="asset-dialog-title" data-campaign-published-at type="datetime-local"
                aria-label="Published at (UTC)">
            <textarea class="asset-dialog-editor" data-campaign-content aria-label="Content"
                placeholder="Content"></textarea>
            <div class="asset-dialog-actions">
                <button class="asset-dialog-button asset-dialog-delete" data-campaign-delete type="button" hidden>
                    <i class="ri-delete-bin-line" aria-hidden="true"></i>
                    <span>DELETE</span>
                </button>
                <button class="asset-dialog-button asset-dialog-save" data-campaign-save type="button">
                    <i class="ri-save-line" aria-hidden="true"></i>
                    <span>Salvar</span>
                </button>
            </div>
        </form>
    </dialog>

    <dialog class="asset-dialog publish-image-dialog" data-publish-image-dialog
        aria-labelledby="publish-image-dialog-title">
        <div class="asset-dialog-form">
            <div class="asset-dialog-header">
                <h2 id="publish-image-dialog-title" data-publish-image-dialog-title>Imagem</h2>
                <button class="asset-dialog-close" data-publish-image-dialog-close type="button" aria-label="Fechar"
                    title="Fechar">
                    <i class="ri-close-line" aria-hidden="true"></i>
                </button>
            </div>
            <img class="image-dialog-preview" data-publish-image-dialog-preview alt="">
            <div class="asset-dialog-actions">
                <button class="asset-dialog-button asset-dialog-delete" data-publish-image-delete type="button">
                    <i class="ri-delete-bin-line" aria-hidden="true"></i>
                    <span>DELETE</span>
                </button>
            </div>
        </div>
    </dialog>

    <script src="js/folder-store.js"></script>
    <script src="js/publish.js"></script>
</body>

</html>
