<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
    <title>Studio | Articles</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="back-button" href="index.html" aria-label="Voltar para o Studio" title="Voltar">
                <i class="ri-arrow-left-line" aria-hidden="true"></i>
                <span>BACK</span>
            </a>

            <div class="header-actions">
                <button class="header-button" id="theme-toggle" type="button" aria-label="Ativar tema escuro"
                    title="Ativar tema escuro" aria-pressed="false">
                    <i class="ri-moon-line header-button-icon" aria-hidden="true"></i>
                    <span class="header-button-label">Theme</span>
                </button>
            </div>
        </header>

        <main class="app-main articles-main">
            <section class="articles-view" aria-labelledby="articles-title">
                <div class="articles-view-header">
                    <div>
                        <h1 id="articles-title">Articles</h1>
                    </div>
                    <span class="articles-count" data-articles-count aria-live="polite"></span>
                </div>
                <div class="articles-content-layout">
                    <div class="article-card-list" data-article-card-list aria-live="polite"></div>
                    <aside class="articles-filters" aria-label="Filtros de artigos">
                        <label class="articles-search" for="article-search">
                            <i class="ri-search-line" aria-hidden="true"></i>
                            <input id="article-search" type="search" placeholder="Buscar por título, sumário ou slug"
                                autocomplete="off">
                        </label>
                        <fieldset class="article-status-filters">
                            <legend>Status</legend>
                            <label class="article-status-option">
                                <input type="checkbox" data-article-status-all checked>
                                <span>Todos</span>
                            </label>
                            <div class="article-status-options" data-article-status-options></div>
                        </fieldset>
                        <label class="article-sort" for="article-sort">
                            <span>Ordenar</span>
                            <select id="article-sort">
                                <option value="title-asc">Título (A-Z)</option>
                                <option value="published-asc">published_at_utc (ASC)</option>
                                <option value="published-desc">published_at_utc (DESC)</option>
                            </select>
                        </label>
                    </aside>
                </div>
            </section>
        </main>

        <div class="folder-status" data-articles-status role="status" aria-live="polite" aria-hidden="true">
            <i class="ri-information-line folder-status-icon" aria-hidden="true"></i>
            <span class="folder-status-message"></span>
        </div>
    </div>

    <script src="js/folder-store.js"></script>
    <script src="js/articles.js"></script>
</body>

</html>
